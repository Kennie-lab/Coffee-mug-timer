<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coffee Mug Timer</title>
  <style>
    html {
  font-size: 18px;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  min-height: 100vh; /* Zorg dat het de hele hoogte van het scherm benut */
  padding: 30px 15px;
  font-family: 'Arial', sans-serif;
  background-color: #f3e8dc;
  color: #3e2f2f;
  text-align: center;
  margin: 0;
  margin-left: auto;
  margin-right: auto;

}


    h1 {
      margin-bottom: 10px;
    }

    #flip-clock {
      font-size: 2.5em;
      font-family: monospace;
      margin: 10px 0 100px;
    }

    .mug-container {
      position: relative;
      width: 240px;
      height: 300px;
      margin: 0 auto;
      margin-bottom: 100px;
    }

    .handle {
      position: absolute;
      right: -70px;
      top: 80px;
      width: 35px;
      height: 90px;
      border: 15px solid white;
      border-left: none;
      border-radius: 0 60px 60px 0;
      z-index: 0;
    }

    .mug {
      width: 100%;
      height: 100%;
      border: 15px solid white;
      border-radius: 0 0 100px 100px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .coffee-fill {
      background-color: #c69c6d;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: height 1s linear;
      z-index: -1;
      border-radius: 0 0 85px 85px;
    }

    .steam {
  position: absolute;
  top: 0;
  left: 50%;
  width: 24px;
  height: 90px;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
  opacity: 0.8;
  border-radius: 50%;
  animation: steamUp 3s infinite ease-in;
  transform: translateX(-50%);
  pointer-events: none;
  filter: blur(1px);
}

/* Kleine variaties voor natuurlijke look */
.steam1 {
  animation-delay: 0s;
  width: 22px;
  height: 80px;
}

.steam2 {
  animation-delay: 1s;
  width: 18px;
  height: 65px;
  left: 46%;
}

.steam3 {
  animation-delay: 2s;
  width: 20px;
  height: 75px;
  left: 54%;
}

@keyframes steamUp {
  0% {
    transform: translateX(-50%) translateY(0) scale(1);
    opacity: 0.8;
  }
  100% {
    transform: translateX(-50%) translateY(-100px) scale(1.3);
    opacity: 0;
  }
}


    .timer-settings {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin: 30px auto 20px;
      margin-bottom: 10px;
    }

    .time-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      margin-bottom: 5px;
      font-size: 0.9em;
    }

    input {
      font-size: 1.3rem;
      text-align: center;
      width: 70px;
      padding: 6px 10px;
      border: none;
      border-radius: 10px;
      background: white;
    }

    .timer-controls {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      background-color: #c1a67b;
      border: none;
      padding: 10px 20px;
      color: white;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }

    .donate {
      margin-top: 0px;
    }

    .donate-btn {
      background-color: #b85d5d;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      .timer-settings {
        flex-direction: column;
        gap: 20px;
      }

      .mug-container {
        width: 160px;
        height: 220px;
      }

      .handle {
        right: -30px;
        top: 50px;
        width: 30px;
        height: 70px;
      }
    }
  </style>
</head>
<body> 
  <h1>Coffee Mug Timer</h1>
  <div id="flip-clock">00:00</div>

  <div class="mug-container">
    <div class="handle"></div>
    <div class="steam steam1"></div>
    <div class="steam steam2"></div>
    <div class="steam steam3"></div>

    <div class="mug">
      <div class="coffee-fill" id="coffee-fill"></div>
    </div>
  </div>

  <div class="timer-settings">
    <div class="time-group">
      <label for="work-time">Work time (minutes):</label>
      <input type="number" id="work-time" min="1" value="25" />
    </div>
    <div class="time-group">
      <label for="break-time">Break time (minutes):</label>
      <input type="number" id="break-time" min="1" value="5" />
    </div>
  </div>

  <div class="timer-controls">
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

  <div class="donate">
    <p>Enjoying this timer? Treat us to a coffee and help us build more fun stuff ☕</p>
    <button class="donate-btn" onclick="window.open('https://paypal.me/kennieroethof', '_blank')">Coffee ☕</button>
  </div>

  <!-- 🔊 Jouw audio -->
  <audio id="alert-sound" src="coffee-timer-alarm.mp3" preload="auto"></audio>

  <script>
    document.body.addEventListener('click', () => {
  document.getElementById('alert-sound').play().catch(() => {});
}, { once: true });

    let interval;
    let isPaused = false;
    let isBreak = false;
    let totalTime = 0;
    let remainingTime = 0;

    function formatTime(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateClock() {
      document.getElementById('flip-clock').textContent = formatTime(remainingTime);
      const percentage = remainingTime / totalTime;
      const fill = isBreak ? 1 - percentage : percentage;
      document.getElementById('coffee-fill').style.height = `${fill * 100}%`;
    }

    function tick() {
      if (!isPaused && remainingTime > 0) {
        remainingTime--;
        updateClock();
      } else if (remainingTime <= 0) {
        clearInterval(interval);
        document.getElementById('alert-sound').play(); // 🔔 Geluidje afspelen
        isBreak = !isBreak;
        startTimer();
      }
    }

    function startTimer() {
      const work = parseInt(document.getElementById('work-time').value) * 60;
      const pause = parseInt(document.getElementById('break-time').value) * 60;

      if (remainingTime <= 0) {
        totalTime = isBreak ? pause : work;
        remainingTime = totalTime;
      }

      isPaused = false;
      updateClock();
      clearInterval(interval);
      interval = setInterval(tick, 1000);
    }

    function pauseTimer() {
      isPaused = !isPaused;
    }

    function resetTimer() {
      clearInterval(interval);
      isPaused = false;
      isBreak = false;
      remainingTime = 0;
      totalTime = 0;
      document.getElementById('flip-clock').textContent = "00:00";
      document.getElementById('coffee-fill').style.height = '100%';
    }
  </script>
</body>
</html>
